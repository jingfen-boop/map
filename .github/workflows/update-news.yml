name: 更新日本颱風中文新聞

on:
  workflow_dispatch:

  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: 下載 Repository
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 產生新聞頁面
        run: python update_news.py

      - name: 儲存更新結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add typhoon-news.html

          if git diff --cached --quiet; then
            echo "新聞內容沒有變化，不需要提交。"
          else
            git commit -m "自動更新颱風新聞"
            git push
          fi
