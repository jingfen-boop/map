<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本九天行程總覽地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:#f5f7f8;color:#40515a}
    .wrap{max-width:1200px;margin:auto;padding:12px}
    .title{text-align:center;font-size:24px;font-weight:700;margin:4px 0 4px}
    .subtitle{text-align:center;font-size:13px;color:#74848b;margin-bottom:12px;line-height:1.7}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
    .day-btn{border:0;border-radius:18px;padding:8px 12px;color:#fff;font-weight:700;cursor:pointer}
    .day-btn.off{opacity:.28;filter:grayscale(.5)}
    .all-btn{background:#596a72}
    #map{height:720px;border:1px solid #dbe3e6;border-radius:16px;background:#e9eef0}
    .legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}
    .legend-item{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #dfe7ea;border-radius:12px;padding:9px 10px;font-size:12px;line-height:1.55}
    .dot{width:12px;height:12px;border-radius:50%;margin-top:3px;flex:0 0 auto}
    .note{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff8e8;border:1px solid #eadab8;color:#745f3f;font-size:12px;line-height:1.7}
    .place-marker{display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translateY(-50%)}
    .place-dot{width:15px;height:15px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);flex:0 0 auto}
    .place-name{padding:3px 7px;border-radius:9px;background:rgba(255,255,255,.94);border:2px solid;box-shadow:0 1px 5px rgba(0,0,0,.18);font-size:12px;font-weight:700;color:#35454c;line-height:1.2}
    .leaflet-marker-icon{overflow:visible!important}
    .leaflet-popup-content{font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;line-height:1.6}
    .gmaps{display:inline-block;margin-top:6px;padding:6px 9px;border-radius:14px;background:#5f7d87;color:#fff!important;text-decoration:none;font-size:12px;font-weight:700}
    @media(max-width:700px){#map{height:600px}.title{font-size:20px}.day-btn{font-size:12px;padding:7px 10px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">🗾 日本中部・北關東 9 天行程總覽地圖</div>
  <div class="subtitle">每一天使用不同顏色，景點名稱直接顯示在地圖上；可點選上方按鈕顯示或隱藏該日行程，點擊地名可開啟 Google Maps。</div>
  <div class="toolbar" id="toolbar"></div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>
  <div class="note">此圖是「旅程總覽圖」，彩色線條為依每日景點順序連接的示意線，不代表實際道路或鐵路路徑。景點名稱已直接標示；東京等景點密集區可放大查看。需要導航時請點地名，再按 Google Maps 按鈕。</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const days = [
 {day:1,color:'#2E8B57',title:'中部機場 → 名古屋',places:[
  ['中部國際機場',34.8584,136.8054],['Vessel Hotel Campana 名古屋',35.1776,136.8812]
 ]},
 {day:2,color:'#2878B5',title:'名古屋 → 美濃 → 福井 → 加賀',places:[
  ['Vessel Hotel Campana 名古屋',35.1776,136.8812],['美濃和紙之里會館',35.5875,136.9108],['福井縣立恐龍博物館',36.0835,136.5065],['加賀片山津溫泉 佳水鄉',36.3410,136.3700]
 ]},
 {day:3,color:'#E07A24',title:'加賀 → 金澤 → 高山',places:[
  ['佳水鄉',36.3410,136.3700],['兼六園',36.5621,136.6626],['近江町市場',36.5717,136.6566],['高山三町老街',36.1408,137.2607],['高山 Green Hotel',36.1356,137.2469]
 ]},
 {day:4,color:'#D34B4B',title:'高山 → 上高地 → 松本',places:[
  ['高山 Green Hotel',36.1356,137.2469],['宮川朝市',36.1452,137.2574],['平湯巴士總站',36.1913,137.5523],['上高地巴士總站',36.2497,137.6330],['大正池',36.2236,137.6085],['河童橋',36.2479,137.6384],['翔峰飯店（松本）',36.2387,138.0037]
 ]},
 {day:5,color:'#7A55A5',title:'松本 → 鬼押出園 → 草津',places:[
  ['翔峰飯店',36.2387,138.0037],['松本城',36.2380,137.9699],['繩手通',36.2355,137.9716],['鬼押出園',36.4478,138.5291],['草津湯畑',36.6228,138.5967],['Hotel Sakurai',36.6205,138.5905]
 ]},
 {day:6,color:'#8B5E3C',title:'草津 → 川場 → 日光 → 鬼怒川',places:[
  ['Hotel Sakurai',36.6205,138.5905],['川場田園廣場',36.6941,139.1020],['華嚴瀑布',36.7380,139.5003],['日光東照宮',36.7580,139.5988],['鬼怒川 Asaya Hotel',36.8335,139.7126]
 ]},
 {day:7,color:'#159EAE',title:'鬼怒川 → 日光江戶村 → 押上 → 秋葉原',places:[
  ['鬼怒川 Asaya Hotel',36.8335,139.7126],['日光江戶村',36.7906,139.6977],['鬼平江戶處（羽生PA）',36.2025,139.5604],['Richmond Premier 押上',35.7102,139.8136],['秋葉原 Yodobashi Akiba',35.6986,139.7749]
 ]},
 {day:8,color:'#D75A95',title:'押上 → 哈利波特影城 → 晴空塔',places:[
  ['Richmond Premier 押上',35.7102,139.8136],['哈利波特影城東京',35.7435,139.6492],['東京晴空塔',35.7101,139.8107],['Piccole Lampare',35.7121,139.8143],['LIFE Central Square 押上',35.7092,139.8148]
 ]},
 {day:9,color:'#59636B',title:'墨田區散步 → 成田機場',places:[
  ['Richmond Premier 押上',35.7102,139.8136],['隅田公園墨田區側',35.7162,139.8035],['成田機場第二航廈',35.7732,140.3874]
 ]}
];

const map=L.map('map',{zoomControl:true}).setView([36.05,138.05],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const groups={};
const toolbar=document.getElementById('toolbar');
const legend=document.getElementById('legend');

function markerIcon(name,color){
 const safeName=name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
 return L.divIcon({
  className:'',
  html:`<div class="place-marker"><span class="place-dot" style="background:${color}"></span><span class="place-name" style="border-color:${color}">${safeName}</span></div>`,
  iconSize:[1,1],
  iconAnchor:[7,0],
  popupAnchor:[30,-8]
 });
}
function googleUrl(name){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name+', Japan');}

days.forEach(d=>{
 const g=L.layerGroup().addTo(map); groups[d.day]=g;
 const coords=[];
 d.places.forEach((p,i)=>{
  const [name,lat,lng]=p; coords.push([lat,lng]);
  const marker=L.marker([lat,lng],{icon:markerIcon(name,d.color),zIndexOffset:100+d.day}).addTo(g);
  marker.bindPopup(`<b>Day ${d.day}｜${name}</b><br><a class="gmaps" target="_blank" rel="noopener" href="${googleUrl(name)}">在 Google Maps 開啟</a>`);
 });
 L.polyline(coords,{color:d.color,weight:4,opacity:.8,dashArray:d.day===9?'8,7':null}).addTo(g);
 const b=document.createElement('button'); b.className='day-btn'; b.style.background=d.color; b.textContent=`Day ${d.day}`; b.dataset.day=d.day;
 b.addEventListener('click',()=>{if(map.hasLayer(g)){map.removeLayer(g);b.classList.add('off')}else{g.addTo(map);b.classList.remove('off')}}); toolbar.appendChild(b);
 const li=document.createElement('div'); li.className='legend-item'; li.innerHTML=`<span class="dot" style="background:${d.color}"></span><div><b>Day ${d.day}｜${d.title}</b><br>${d.places.map(x=>x[0]).join(' → ')}</div>`; legend.appendChild(li);
});
const all=document.createElement('button'); all.className='day-btn all-btn'; all.textContent='顯示全部';
all.addEventListener('click',()=>{days.forEach(d=>{groups[d.day].addTo(map);document.querySelector(`[data-day="${d.day}"]`).classList.remove('off')});map.setView([36.05,138.05],7)}); toolbar.prepend(all);
const none=document.createElement('button'); none.className='day-btn all-btn'; none.textContent='全部隱藏';
none.addEventListener('click',()=>{days.forEach(d=>{map.removeLayer(groups[d.day]);document.querySelector(`[data-day="${d.day}"]`).classList.add('off')})}); toolbar.insertBefore(none,toolbar.children[1]);
</script>
</body>
</html>
