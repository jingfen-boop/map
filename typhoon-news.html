<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta http-equiv="refresh" content="1800">

  <title>日本颱風中文新聞</title>

  <style>
    :root {
      --navy: #173b67;
      --blue: #2e73b8;
      --pale-blue: #eef7ff;
      --border: #dce8f2;
      --text: #263442;
      --muted: #687888;
      --white: #ffffff;
      --warning: #fff8e8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7fafc;
      color: var(--text);
      font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    }

    .page {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 20px 14px 30px;
    }

    .header {
      padding: 22px;
      margin-bottom: 16px;
      color: var(--white);
      background:
        linear-gradient(135deg, #173b67, #4288c8);
      border-radius: 18px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 5vw, 34px);
    }

    .header p {
      margin: 0;
      line-height: 1.7;
      opacity: 0.95;
    }

    .status {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      padding: 12px 15px;
      margin-bottom: 14px;
      background: var(--warning);
      border: 1px solid #f1dfb4;
      border-radius: 12px;
      font-size: 14px;
      color: #725b2d;
    }

    .status strong {
      color: #554218;
    }

    .news-list {
      display: grid;
      gap: 12px;
    }

    .news-card {
      padding: 17px 18px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .news-card:hover {
      border-color: #a8c9e6;
    }

    .news-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 9px;
      font-size: 13px;
      color: var(--muted);
    }

    .source {
      padding: 3px 9px;
      color: var(--navy);
      background: var(--pale-blue);
      border-radius: 999px;
      font-weight: 700;
    }

    .news-card h2 {
      margin: 0 0 12px;
      font-size: clamp(17px, 3.8vw, 21px);
      line-height: 1.55;
    }

    .news-card h2 a {
      color: var(--text);
      text-decoration: none;
    }

    .news-card h2 a:hover {
      color: var(--blue);
      text-decoration: underline;
    }

    .read-more {
      display: inline-block;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .empty {
      padding: 28px;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .footer {
      margin-top: 17px;
      padding: 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 520px) {
      .page {
        padding: 10px 8px 20px;
      }

      .header {
        padding: 18px 16px;
        border-radius: 13px;
      }

      .news-card {
        padding: 15px;
      }

      .news-meta {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>🌀 日本颱風中文新聞</h1>
      <p>
        自動彙整與日本颱風、暴風雨及旅遊影響相關的中文新聞。
      </p>
    </header>

    <section class="status">
      <strong>最近更新：</strong>
      <span>2026/09/04 01:48（台灣時間）</span>
      <span>｜約每 30 分鐘檢查一次</span>
    </section>

    <section class="news-list">
      
        <div class="empty">
          目前沒有取得相關新聞，請稍後重新整理。
        </div>
        
    </section>

    <footer class="footer">
      新聞內容與標題著作權屬原發布媒體所有。
      本頁僅顯示標題、來源、時間與原文連結。
      颱風警報及旅行決策仍應以日本氣象廳、
      航空公司與交通機構的正式公告為準。
    </footer>
  </main>
</body>
</html>
